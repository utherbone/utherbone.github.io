<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANC Tester - Local Safe Mode</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            margin-top: -6px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
        #sounds_grid {
          margin-bottom: 100px;
        }
    </style>
</head>
<body class="bg-neutral-900 text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // --- ÍCONES SVG (Manuais para não depender de script externo) ---
        const Icons = {
            Coffee: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>,
            CarFront: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/></svg>,
            Truck: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>,
            CloudRain: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>,
            Wind: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            Construction: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="6" width="20" height="8" rx="1"/><path d="M17 14v7"/><path d="M7 14v7"/><path d="M17 3v3"/><path d="M7 3v3"/><path d="M10 14 2.3 6.3"/><path d="m14 6 7.7 7.7"/><path d="m8 6 8 8"/></svg>,
            Volume2: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            Play: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>,
            Square: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>,
            AlertCircle: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Radio: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>,
            Utensils: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>,
            Snowflake: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg>,
            TrafficLight: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="10" height="20" x="7" y="2" rx="2"/><path d="M12 6h.01"/><path d="M12 12h.01"/><path d="M12 18h.01"/></svg>,
            CloudLightning: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></svg>,
            Ambulance: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 10H6"/><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.28a1 1 0 0 0-.611-.923l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/><path d="M8 10h4"/><path d="M10 8v4"/></svg>,
            FirstAid: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="14" x="3" y="8" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 13h4"/><path d="M12 11v4"/></svg>,
            Siren: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 19 5"/><path d="M2 12h1"/><path d="M5.5 4.5 5 5"/></svg>,
            Jackhammer: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2V22"/><path d="M12 2l-3 3-2-2"/><path d="M12 2l3 3 2-2"/><path d="M9 10h6"/><path d="M9 14h6"/><path d="M7 18h10"/><path d="M5 22h14"/></svg>,
            Ambulance: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {/* Corpo Principal */}
            <path d="M20 17h2V9.5a2 2 0 0 0-1.5-1.9l-3.5-1.1V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12h2 " />
            {/* Divisória da Cabine */}
            <path d="M15.8 4.5v11" />
            {/* Fundo da do corpo */}
            <path d="M09 17h5" /> 
            {/* Cruz Médica */}
            <path d="M7 10h4" />
            <path d="M9 8v4" />
            {/* Rodas */}
            <circle cx="7" cy="17" r="2" />
            <circle cx="17" cy="17" r="2" />
            </svg>,
            Radiation: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {/* Círculo Central */}
            <circle cx="12" cy="12" r="2.5" />
            {/* Folhas Externas (trevo) */}
            <path d="M12 2v2" /> {/* Topo */}
            <path d="M22 12h-2" /> {/* Direita */}
            <path d="M12 22v-2" /> {/* Baixo */}
            <path d="M2 12h2" /> {/* Esquerda */}
            {/* Linhas Conectoras */}
            <path d="M15.5 4.5l-1.5 1.5" /> {/* Superior Direita */}
            <path d="M18.5 7.5l-1.5 1.5" />
            <path d="M4.5 8.5l1.5 1.5" /> {/* Superior Esquerda */}
            <path d="M7.5 5.5l1.5 1.5" />
            <path d="M8.5 19.5l1.5-1.5" /> {/* Inferior Esquerda */}
            <path d="M5.5 16.5l1.5-1.5" />
            <path d="M19.5 15.5l-1.5-1.5" /> {/* Inferior Direita */}
            <path d="M16.5 18.5l-1.5-1.5" />
            </svg>,
            PoliceSiren: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {/* Base da sirene (alto-falante/suporte) */}
            <path d="M4 12h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2z" />
            <path d="M8 12h8" /> {/* Conexão central */}
            <path d="M18 12h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2z" />
            {/* Luzes superiores */}
            <rect x="6" y="6" width="4" height="4" rx="1" ry="1" /> {/* Luz esquerda */}
            <rect x="14" y="6" width="4" height="4" rx="1" ry="1" /> {/* Luz direita */}           
            {/* Haste de suporte das luzes */}
            <path d="M12 18v2" /> 
            <path d="M10 6h4" /> {/* Base das luzes */}
            </svg>
        };

        // CONFIGURAÇÃO DE ARQUIVOS LOCAIS
        const SOUND_LIBRARY = [
          { id: 'ambulância', name: 'Ambulância', icon: Icons.Ambulance, url: './sounds/ambulância.mp3', desc: 'Arquivo: sounds/ambulância.mp3', color: 'bg-red-600' },
          { id: 'polícia', name: 'Polícia', icon: Icons.PoliceSiren, url: './sounds/polícia.mp3', desc: 'Arquivo: sounds/polícia.mp3', color: 'bg-red-600' },
          { id: 'nuclear', name: 'Nuclear', icon: Icons.Radiation, url: './sounds/nuclear.mp3', desc: 'Arquivo: sounds/nuclear.mp3', color: 'bg-red-600' },
          { id: 'britadeira1', name: 'Britadeira 1', icon: Icons.Jackhammer, url: './sounds/britadeira1.mp3', desc: 'Arquivo: sounds/britadeira1.mp3', color: 'bg-red-600' },
          { id: 'britadeira2', name: 'Britadeira 2', icon: Icons.Jackhammer, url: './sounds/britadeira2.mp3', desc: 'Arquivo: sounds/britadeira2.mp3', color: 'bg-red-600' },
          { id: 'britadeira3', name: 'Britadeira 3', icon: Icons.Jackhammer, url: './sounds/britadeira3.mp3', desc: 'Arquivo: sounds/britadeira3.mp3', color: 'bg-red-600' },
          { id: 'nevasca1', name: 'Nevasca 1', icon: Icons.Truck, url: './sounds/nevasca1.mp3', desc: 'Arquivo: sounds/nevasca1.mp3', color: 'bg-orange-600' },
          { id: 'nevasca2', name: 'Nevasca 2', icon: Icons.Truck, url: './sounds/nevasca2.mp3', desc: 'Arquivo: sounds/nevasca2.mp3', color: 'bg-orange-600' },
          { id: 'nevasca3', name: 'Nevasca 3', icon: Icons.Truck, url: './sounds/nevasca3.mp3', desc: 'Arquivo: sounds/nevasca3.mp3', color: 'bg-orange-600' },
          { id: 'cafeteria1', name: 'Cafeteria 1', icon: Icons.Coffee, url: './sounds/cafeteria1.mp3', desc: 'Arquivo: sounds/cafeteria1.mp3', color: 'bg-amber-600' },
          { id: 'cafeteria2', name: 'Cafeteria 2', icon: Icons.Coffee, url: './sounds/cafeteria2.mp3', desc: 'Arquivo: sounds/cafeteria2.mp3', color: 'bg-amber-600' },
          { id: 'cafeteria3', name: 'Cafeteria 3', icon: Icons.Coffee, url: './sounds/cafeteria3.mp3', desc: 'Arquivo: sounds/cafeteria3.mp3', color: 'bg-amber-600' },
          { id: 'transito1', name: 'Transito 1', icon: Icons.TrafficLight, url: './sounds/transito1.mp3', desc: 'Arquivo: sounds/transito1.mp3', color: 'bg-yellow-600' },
          { id: 'transito2', name: 'Transito 2', icon: Icons.TrafficLight, url: './sounds/transito2.mp3', desc: 'Arquivo: sounds/transito2.mp3', color: 'bg-yellow-600' },
          { id: 'transito3', name: 'Transito 3', icon: Icons.TrafficLight, url: './sounds/transito3.mp3', desc: 'Arquivo: sounds/transito2.mp3', color: 'bg-yellow-600' },
          { id: 'tempestade1', name: 'Tempestade 1', icon: Icons.CloudRain, url: './sounds/tempestade1.mp3', desc: 'Arquivo: sounds/tempestade1.mp3', color: 'bg-blue-600' },
          { id: 'tempestade2', name: 'Tempestade 2', icon: Icons.CloudRain, url: './sounds/tempestade2.mp3', desc: 'Arquivo: sounds/tempestade2.mp3', color: 'bg-blue-600' },
          { id: 'tempestade3', name: 'Tempestade 3', icon: Icons.CloudLightning, url: './sounds/tempestade3.mp3', desc: 'Arquivo: sounds/tempestade3.mp3', color: 'bg-blue-600' },
          { id: 'vento1', name: 'Ventilador 1', icon: Icons.Wind, url: './sounds/vento1.mp3', desc: 'Arquivo: sounds/vento1.mp3', color: 'bg-cyan-600' },
          { id: 'vento2', name: 'Ventilador 2', icon: Icons.Wind, url: './sounds/vento2.mp3', desc: 'Arquivo: sounds/vento2.mp3', color: 'bg-cyan-600' },
          { id: 'vento3', name: 'Ventilador 3', icon: Icons.Wind, url: './sounds/vento3.mp3', desc: 'Arquivo: sounds/vento3.mp3', color: 'bg-cyan-600' }
        ];

        function App() {
          const [activeId, setActiveId] = useState(null);
          const [isPlaying, setIsPlaying] = useState(false);
          const [isLoading, setIsLoading] = useState(false);
          const [volume, setVolume] = useState(1.0);
          const [statusMsg, setStatusMsg] = useState('Pronto');

          const audioRef = useRef(null);
          const currentIntentId = useRef(null);

          useEffect(() => {
            if (audioRef.current) {
                audioRef.current.volume = volume;
            }
          }, [volume]);

          const stopAll = () => {
            setStatusMsg('Parado');
            currentIntentId.current = null;

            if (audioRef.current) {
              audioRef.current.pause();
              // Não limpamos o src aqui para evitar delay se re-tocar o mesmo som
              // apenas pausamos.
            }
            
            setIsPlaying(false);
            setIsLoading(false);
            setActiveId(null);
          };

          const playSound = (item) => {
            if (activeId === item.id) {
              stopAll();
              return;
            }

            // Se já existe um player, pausa ele
            if (audioRef.current) {
                audioRef.current.pause();
            }

            currentIntentId.current = item.id;
            setActiveId(item.id);
            setIsLoading(true);
            setStatusMsg(`Carregando...`);

            // Cria um novo elemento de áudio simples
            const audio = new Audio(item.url);
            audio.loop = true;
            audio.volume = volume;

            audioRef.current = audio;

            // Tentar tocar
            const playPromise = audio.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    if (currentIntentId.current === item.id) {
                        setIsLoading(false);
                        setIsPlaying(true);
                        setStatusMsg(`Tocando: ${item.name}`);
                    } else {
                        audio.pause(); // Usuário trocou rápido demais
                    }
                })
                .catch(error => {
                    console.error("Erro playback:", error);
                    setIsLoading(false);
                    setStatusMsg("Erro: Arquivo não encontrado em ./sounds/");
                });
            }
          };

          return (
            <div className="min-h-screen bg-neutral-900 text-white selection:bg-indigo-500/30">
              <div className="bg-neutral-800 border-b border-neutral-700 p-4 sticky top-0 z-20 shadow-xl">
                <div className="max-w-md mx-auto flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <Icons.Radio className="w-5 h-5 text-green-400" />
                    <h1 className="font-bold text-lg">ANC Tester <span className="text-xs bg-green-600 px-1 rounded text-white">SAFE MODE</span></h1>
                  </div>
                  <div className="flex items-center gap-2 bg-neutral-900/50 px-3 py-1 rounded-full border border-neutral-700">
                     {isLoading && <div className="w-2 h-2 bg-yellow-400 rounded-full animate-pulse" />}
                     {isPlaying && !isLoading && <div className="w-2 h-2 bg-green-500 rounded-full animate-ping" />}
                     {!isPlaying && !isLoading && <div className="w-2 h-2 bg-red-500 rounded-full" />}
                     <span className="text-xs font-mono text-neutral-400 truncate max-w-[120px]">
                       {statusMsg}
                     </span>
                  </div>
                </div>
              </div>

              <main className="max-w-md mx-auto p-4 pb-32 space-y-4">
                <div className="bg-green-900/20 border border-green-500/30 p-3 rounded-lg flex gap-3 items-start text-sm text-green-200">
                  <Icons.AlertCircle className="w-5 h-5 shrink-0 mt-0.5 text-green-500" />
                  <div>
                      <p className="font-bold mb-1">Modo Local Seguro</p>
                      <p>Clique em um efeito de ruído!</p>
                      <p>Para parar clique sobre o mesmo ruído novamente ou clique no botão Parar Tudo final da página.</p>
                  </div>
                </div>

                <div id="sounds_grid" className="grid gap-3">
                  {SOUND_LIBRARY.map((item) => {
                    const isActive = activeId === item.id;
                    const IconComponent = item.icon;
                    return (
                      <button
                        key={item.id}
                        onClick={() => playSound(item)}
                        className={`
                          relative w-full text-left p-4 rounded-xl border transition-all duration-200
                          flex items-center gap-4 group overflow-hidden
                          ${isActive 
                            ? `${item.color} border-white/20 shadow-lg scale-[1.01]` 
                            : 'bg-neutral-800 border-neutral-700 hover:bg-neutral-750'
                          }
                        `}
                      >
                        <div className={`
                          p-3 rounded-lg shrink-0 transition-colors
                          ${isActive ? 'bg-white/20 text-white' : 'bg-neutral-700 text-neutral-400 group-hover:text-white'}
                        `}>
                          {isLoading && isActive ? (
                            <div className="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                          ) : isActive ? (
                            <Icons.Square className="w-6 h-6 fill-current" />
                          ) : (
                            <IconComponent className="w-6 h-6" />
                          )}
                        </div>

                        <div className="flex-1 min-w-0">
                          <h3 className={`font-bold text-base truncate ${isActive ? 'text-white' : 'text-neutral-200'}`}>
                            {item.name}
                          </h3>
                          <p className={`text-xs truncate ${isActive ? 'text-white/80' : 'text-neutral-500'}`}>
                            {item.desc}
                          </p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </main>

              <div className="fixed bottom-0 left-0 right-0 bg-neutral-900/95 backdrop-blur-md border-t border-neutral-800 p-6 pb-8 z-30">
                <div className="max-w-md mx-auto space-y-4">
                  <div className="flex items-center justify-between text-xs text-neutral-400 uppercase font-bold tracking-wider">
                     <span>Volume</span>
                     <span>{Math.round(volume * 100)}%</span>
                  </div>
                  <div className="flex items-center gap-4">
                    <Icons.Volume2 className="w-6 h-6 text-neutral-400" />
                    <input
                      type="range"
                      min="0"
                      max="1"
                      step="0.05"
                      value={volume}
                      onChange={(e) => setVolume(parseFloat(e.target.value))}
                      className="w-full h-3 bg-neutral-700 rounded-full appearance-none cursor-pointer accent-white hover:accent-gray-200 touch-none"
                    />
                  </div>
                  
                  {isPlaying && (
                     <button 
                       onClick={stopAll}
                       className="w-full py-3 mt-2 bg-neutral-800 hover:bg-neutral-700 border border-neutral-600 text-neutral-300 rounded-lg font-semibold transition-colors"
                     >
                       Parar Tudo
                     </button>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
